version: '3.8'

services:
  studentsdb:
    container_name: studentsdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_strong_Password123!
    ports:
      - "1433:1433"

  coursesdb:
    container_name: coursesdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_strong_Password123!
    ports:
      - "1434:1433"

  rabbitmq:
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  studentsapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5001:8080"

  coursesapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5002:8080"

  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5000:8080"
    volumes:
      - ./apigateway/ocelot.json:/app/ocelot.json